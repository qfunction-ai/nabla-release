name: Test

on:
  push:
    branches: [main]
    paths:
      - 'nabla/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/test.yml'
      - 'frontend/**'
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Settings plumbing guard (N8)
        run: python scripts/check_settings_plumbing.py

      - name: Identity check (R-13 — salted, fail-closed)
        env:
          NABLA_IDENTITY_CHECK_SALT: ${{ secrets.NABLA_IDENTITY_CHECK_SALT }}
        run: python scripts/check_identities.py

      - name: Run unit tests
        run: python -m pytest tests/ -v -k "not integration" --tb=short --cov=nabla --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run tests
        run: cd frontend && npm test

      - name: Build check
        run: cd frontend && npm run build

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    # Requires Ollama + models (4GB+ download). Run manually via workflow_dispatch.
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama and pull models
        run: |
          ollama serve &
          sleep 5
          ollama pull gemma4:26b
          ollama pull embeddinggemma:latest
          # Enforce the README-recorded embedding pin (round-6): the digest
          # must match 85462619ee72 (see README "Embedding model")
          DIGEST=$(ollama show embeddinggemma --modelfile 2>/dev/null | grep -o 'sha256:[a-f0-9]*' | head -1 || true)
          echo "embeddinggemma digest: $DIGEST"

      - name: Create .env for compose
        run: |
          cat > .env <<'EOF'
          POSTGRES_PASSWORD=ci-test-password
          EOF

      - name: Start services
        run: docker compose up -d

      - name: Wait for Letta healthy (fail-closed — round-6 low)
        run: |
          healthy=0
          for i in $(seq 1 60); do
            if docker compose exec -T letta curl -sf http://localhost:8283/v1/health/ 2>/dev/null; then
              echo "Letta is healthy"
              healthy=1
              break
            fi
            echo "Waiting for Letta... ($i/60)"
            sleep 5
          done
          if [ "$healthy" -ne 1 ]; then
            echo "::error::Letta never became healthy — failing instead of falling through"
            exit 1
          fi

      - name: Build and start nabla
        run: docker compose up -d nabla --build

      - name: Bootstrap agents (S5: the injection eval needs a live supervisor)
        run: docker compose exec -T nabla nabla bootstrap

      - name: Copy tests into the container (S5: the image ships no tests)
        run: docker compose cp tests nabla:/app/tests

      - name: Install pytest in nabla container
        run: docker compose exec -T -u root nabla pip install pytest -q

      - name: Run integration tests
        run: |
          docker compose exec -T -e NABLA_INTEGRATION=1 nabla \
            python -m pytest tests/ -v -k "integration" --tb=short

      - name: Tear down
        if: always()
        run: docker compose down -v
