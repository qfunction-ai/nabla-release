name: Test

on:
  push:
    branches: [main]
    paths:
      - 'nabla/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/test.yml'
      - 'frontend/**'
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest tests/ -v -k "not integration" --tb=short


  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run tests
        run: cd frontend && npm test

      - name: Env forwarding guard (R22)
        run: |
          cp .env.example .env
          cfg="$(docker compose config 2>/dev/null || true)"
          if [ -z "$cfg" ]; then
            # docker unavailable on runner: static fallback — grep the compose
            cfg="$(cat docker-compose.yml)"
          fi
          missing=0
          for k in $(grep -oE '^NABLA_[A-Z_]+' .env.example); do
            echo "$cfg" | grep -q "$k" || { echo "not forwarded to nabla: $k"; missing=1; }
          done
          rm -f .env
          exit $missing

      - name: Build check
        run: cd frontend && npm run build

