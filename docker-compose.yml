services:
  letta:
    image: ghcr.io/qfunction-ai/letta-local:0.16.31@sha256:cbb12673092261e5ef0654ec6805a9c3bdbdbe57acc97cda364c2d8bb47e489e
    ports:
      - "127.0.0.1:8284:8283"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
      - LETTA_PG_URI=${LETTA_PG_URI:-postgresql://${POSTGRES_USER:-nabla}:${POSTGRES_PASSWORD}@postgres:5432/letta}
      - GLOBAL_MAX_CONTEXT_WINDOW_LIMIT=${GLOBAL_MAX_CONTEXT_WINDOW_LIMIT:-32768}
      # Canary exfiltration tripwire off: zero-tool supervisor, localhost-bound,
      # single user — no injection surface; holdback taxes every chat response.
      # Default is ON in the fork; this is a deliberate local-only opt-out.
      # D8: canary enabled by default — untrusted log content reaches the LLM;
      # opt out explicitly if the latency cost matters in your environment
      - LETTA_CANARY_ENABLED=${LETTA_CANARY_ENABLED:-true}
    volumes:
      - letta_data:/root/.letta
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8283/v1/health/"]
      interval: 10s
      timeout: 5s
      retries: 10
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nabla-backend
      - nabla-db

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-nabla}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      - POSTGRES_DB=letta
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-nabla} -d letta"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nabla-db

  nabla:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8002:8000"
    environment:
      - NABLA_LETTA_BASE_URL=http://letta:8283
      - NABLA_LLM_MODEL=${NABLA_LLM_MODEL:-ollama/gemma4:26b}
      - NABLA_EMBEDDING_MODEL=${NABLA_EMBEDDING_MODEL:-embeddinggemma:latest}
      - NABLA_DATA_DIR=/data
      - NABLA_WEB_ENABLED=${NABLA_WEB_ENABLED:-1}
      - NABLA_SETUP_TOKEN=${NABLA_SETUP_TOKEN:-}
      - NABLA_DEV_MODE=${NABLA_DEV_MODE:-false}
      - NABLA_BASELINE_DAYS=${NABLA_BASELINE_DAYS:-21}
      - NABLA_ENTITY_WARMUP_OBSERVATIONS=${NABLA_ENTITY_WARMUP_OBSERVATIONS:-3}
      - NABLA_EMBEDDING_ENDPOINT=${NABLA_EMBEDDING_ENDPOINT:-http://host.docker.internal:11434/v1}
      - NABLA_SPLUNK_HOST=${NABLA_SPLUNK_HOST:-}
      - NABLA_SPLUNK_TOKEN=${NABLA_SPLUNK_TOKEN:-}
      - NABLA_SPLUNK_USERNAME=${NABLA_SPLUNK_USERNAME:-}
      - NABLA_SPLUNK_PASSWORD=${NABLA_SPLUNK_PASSWORD:-}
      - NABLA_SPLUNK_AUTH_QUERY=${NABLA_SPLUNK_AUTH_QUERY:-}
      - NABLA_SPLUNK_NETWORK_QUERY=${NABLA_SPLUNK_NETWORK_QUERY:-}
      - NABLA_SPLUNK_DNS_QUERY=${NABLA_SPLUNK_DNS_QUERY:-}
      - NABLA_SANCTIONED_SERVICES=${NABLA_SANCTIONED_SERVICES:-}
      - NABLA_TIMEZONE=${NABLA_TIMEZONE:-UTC}
      - NABLA_SPLUNK_ENDPOINT_QUERY=${NABLA_SPLUNK_ENDPOINT_QUERY:-}
      - NABLA_SCHEDULE_ENABLED=${NABLA_SCHEDULE_ENABLED:-0}
      - NABLA_SCHEDULE_INTERVAL_MINUTES=${NABLA_SCHEDULE_INTERVAL_MINUTES:-5}
      - NABLA_SCHEDULE_LOG_TYPES=${NABLA_SCHEDULE_LOG_TYPES:-all}
      - NABLA_SCHEDULE_LOG_COUNT=${NABLA_SCHEDULE_LOG_COUNT:-50}
      - NABLA_SUMOLOGIC_HOST=${NABLA_SUMOLOGIC_HOST:-}
      - NABLA_SUMOLOGIC_ACCESS_ID=${NABLA_SUMOLOGIC_ACCESS_ID:-}
      - NABLA_SUMOLOGIC_ACCESS_KEY=${NABLA_SUMOLOGIC_ACCESS_KEY:-}
      - NABLA_SUMOLOGIC_AUTH_QUERY=${NABLA_SUMOLOGIC_AUTH_QUERY:-}
      - NABLA_SUMOLOGIC_ENDPOINT_QUERY=${NABLA_SUMOLOGIC_ENDPOINT_QUERY:-}
      # ── N8 (round 4): every Settings field reaches the service —
      # reachability is mechanical; the plumbing guard enforces it
      - NABLA_LETTA_API_KEY=${NABLA_LETTA_API_KEY:-}
      - NABLA_TOOL_LETTA_URL=${NABLA_TOOL_LETTA_URL:-}
      - NABLA_LETTA_MAX_CONTEXT_WINDOW=${NABLA_LETTA_MAX_CONTEXT_WINDOW:-32768}
      - NABLA_LETTA_COMPACTION_MODEL=${NABLA_LETTA_COMPACTION_MODEL:-}
      - NABLA_OLLAMA_KEEP_ALIVE=${NABLA_OLLAMA_KEEP_ALIVE:-24h}
      - NABLA_OLLAMA_CONTEXT_LENGTH=${NABLA_OLLAMA_CONTEXT_LENGTH:-32768}
      - NABLA_OLLAMA_FLASH_ATTENTION=${NABLA_OLLAMA_FLASH_ATTENTION:-true}
      - NABLA_OLLAMA_MAX_LOADED_MODELS=${NABLA_OLLAMA_MAX_LOADED_MODELS:-2}
      - NABLA_JWT_EXPIRE_MINUTES=${NABLA_JWT_EXPIRE_MINUTES:-10080}
      - NABLA_WATCHLIST_PATH=${NABLA_WATCHLIST_PATH:-}
      - NABLA_ENV_CONTEXT_PATH=${NABLA_ENV_CONTEXT_PATH:-}
      - NABLA_INGESTION_SOURCE=${NABLA_INGESTION_SOURCE:-auto}
      - NABLA_INGESTION_STATE_PATH=${NABLA_INGESTION_STATE_PATH:-}
      - NABLA_PASSAGE_LIMIT=${NABLA_PASSAGE_LIMIT:-50}
      - NABLA_AGENT_LIST_LIMIT=${NABLA_AGENT_LIST_LIMIT:-100}
      - NABLA_MAX_FILE_ENTRIES=${NABLA_MAX_FILE_ENTRIES:-100000}
      - NABLA_NEW_ACCOUNT_GRACE_DAYS=${NABLA_NEW_ACCOUNT_GRACE_DAYS:-30}
      - NABLA_RISK_SCORE_DECAY_HALF_LIFE_HOURS=${NABLA_RISK_SCORE_DECAY_HALF_LIFE_HOURS:-24.0}
      - NABLA_RISK_SCORE_MAX_ANOMALIES=${NABLA_RISK_SCORE_MAX_ANOMALIES:-20}
      - NABLA_RISK_SCORE_INVESTIGATION_CUTOFF=${NABLA_RISK_SCORE_INVESTIGATION_CUTOFF:-50.0}
      - NABLA_PEER_GROUP_RECOMPUTE_INTERVAL=${NABLA_PEER_GROUP_RECOMPUTE_INTERVAL:-10}
      - NABLA_MACHINE_ACCOUNTS=${NABLA_MACHINE_ACCOUNTS:-}
      - NABLA_HUMAN_ACCOUNTS=${NABLA_HUMAN_ACCOUNTS:-}
      - NABLA_OPERATOR=${NABLA_OPERATOR:-}
      - NABLA_EXFIL_VOLUME_SIGMA=${NABLA_EXFIL_VOLUME_SIGMA:-3.0}
      - NABLA_EXFIL_DNS_ENTROPY_THRESHOLD=${NABLA_EXFIL_DNS_ENTROPY_THRESHOLD:-3.5}
      - NABLA_EXFIL_STAGING_WINDOW_MINUTES=${NABLA_EXFIL_STAGING_WINDOW_MINUTES:-30}
      - NABLA_LOLBAS_SHA256=${NABLA_LOLBAS_SHA256:-}
      - NABLA_GTFOBINS_SHA256=${NABLA_GTFOBINS_SHA256:-}
      - NABLA_SPLUNK_CREDENTIALS_PATH=${NABLA_SPLUNK_CREDENTIALS_PATH:-}
      - NABLA_SPLUNK_VERIFY_SSL=${NABLA_SPLUNK_VERIFY_SSL:-true}
      - NABLA_SPLUNK_VALIDATE_URL=${NABLA_SPLUNK_VALIDATE_URL:-true}
      - NABLA_SPLUNK_QUERIES_PATH=${NABLA_SPLUNK_QUERIES_PATH:-}
      - NABLA_SPLUNK_MAX_RESULTS=${NABLA_SPLUNK_MAX_RESULTS:-10000}
      - NABLA_SUMOLOGIC_CREDENTIALS_PATH=${NABLA_SUMOLOGIC_CREDENTIALS_PATH:-}
      - NABLA_SUMOLOGIC_VERIFY_SSL=${NABLA_SUMOLOGIC_VERIFY_SSL:-true}
      - NABLA_SUMOLOGIC_VALIDATE_URL=${NABLA_SUMOLOGIC_VALIDATE_URL:-true}
      - NABLA_SUMOLOGIC_DNS_QUERY=${NABLA_SUMOLOGIC_DNS_QUERY:-}
      - NABLA_SUMOLOGIC_NETWORK_QUERY=${NABLA_SUMOLOGIC_NETWORK_QUERY:-}
      - NABLA_SUMOLOGIC_QUERIES_PATH=${NABLA_SUMOLOGIC_QUERIES_PATH:-}
      - NABLA_SUMOLOGIC_MAX_RESULTS=${NABLA_SUMOLOGIC_MAX_RESULTS:-10000}
      - NABLA_SUMOLOGIC_POLL_INTERVAL=${NABLA_SUMOLOGIC_POLL_INTERVAL:-5.0}
      - NABLA_SUMOLOGIC_POLL_TIMEOUT=${NABLA_SUMOLOGIC_POLL_TIMEOUT:-300.0}
      - NABLA_WEB_HOST=${NABLA_WEB_HOST:-0.0.0.0}
      - NABLA_WEB_PORT=${NABLA_WEB_PORT:-8000}
      - NABLA_FORWARDED_ALLOW_IPS=${NABLA_FORWARDED_ALLOW_IPS:-172.28.0.2}
    volumes:
      - nabla_data:/data
    depends_on:
      letta:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nabla-backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - nabla
    restart: unless-stopped
    networks:
      nabla-backend:
        # R6-11 (round 6): a FIXED address — the backend trusts exactly
        # this IP for X-Forwarded-For (a dynamic container IP would break
        # that trust on every restart; the compose network is NOT trusted
        # because port 8002 is host-published and bridge-gateway requests
        # from inside it could fake the header)
        ipv4_address: 172.28.0.2

volumes:
  postgres_data:
  letta_data:
  nabla_data:

networks:
  # Letta and Nabla can talk to each other
  nabla-backend:
    ipam:
      config:
        - subnet: 172.28.0.0/29
  # Letta and Postgres can talk to each other
  nabla-db:
