[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nabla"
version = "0.2.0"
description = "UEBA multi-agent system on Letta API"
requires-python = ">=3.11"
dependencies = [
    "letta-client==1.10.3",
    "pydantic-settings==2.14.0",
    "httpx==0.28.1",
    "typer==0.25.0",
    "apscheduler==3.11.2",
    "mitreattack-python==5.1.0",
    "defusedxml==0.7.1",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "bcrypt>=4.0.0",
    "pyjwt>=2.10.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
]

[project.scripts]
nabla = "nabla.cli:app"
nabla-web = "nabla.server:main"

[tool.setuptools.packages.find]
include = ["nabla*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=nabla --cov-report=term-missing --cov-report=xml --cov-fail-under=0"

[tool.coverage.run]
source = ["nabla"]
omit = [
    "nabla/__main__.py",
    "nabla/server.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
